# Настройки темы. Описания к ним — в locales/*.yml, ключ theme_metadata.settings.*
#
# ⚠️ Ключ раздела совпадает с сегментом адреса на сайте: partimento → /partimento.
# Состав полосы задаёт макет (strings.js, product.items):
#   Partimento v3 | Библиотека | Развитие слуха | Блог
# Проверено живьём 15.09: /partimento, /chords, /ear-training, /blog, /metronome,
# /tuner, /music-by-terry-trilla, /gallery отвечают 200. А вот /library, которую
# просит макет словом, на сайте НЕТ — 404. Поэтому «Библиотека» ведёт на /chords,
# а подпись лежит в bar.chords: ключ здесь — АДРЕС, а не слово на кнопке.

product_url:
  type: string
  default: "https://terrytrilla.com"

product_bar_links:
  type: list
  list_type: simple
  default: "partimento|chords|ear-training|blog"

product_bar_more:
  type: list
  list_type: simple
  default: "metronome|tuner|music-by-terry-trilla|gallery"

# ⚠️ Вход ведёт на /login ФОРУМА, а не на страницу входа сайта. С единым входом
# (DiscourseConnect) маршрут /login форума сам отправляет человека к нам и
# возвращает обратно уже вошедшим. Ссылка на terrytrilla.com/login залогинила бы
# его на сайте и оставила гостем на форуме — а после B3 это единственная дверь.
sign_in_url:
  type: string
  default: "/login"

# Кнопка «Виджеты TerryTrilla» в редакторе поста (F4). Сотрудникам видна всегда,
# остальным — участникам этих групп. Решение mvsonm 17.09: начинаем с авторов
# базы знаний.
tt_widgets_groups:
  type: list
  list_type: simple
  default: "kb_authors"
